name: SEO Refresh

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [seo-refresh]

concurrency:
  group: seo-refresh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Write Firebase config
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Restore service-account key
        run: |
          mkdir -p secrets
          echo "${{ secrets.FIREBASE_ADMIN_SDK }}" > secrets/firebase-adminsdk.json

      - name: Install dependencies
        run: npm ci

      - name: Refresh SEO and deploy hosting
        run: npx firebase-tools@latest deploy --only hosting --non-interactive --token "${{ secrets.FIREBASE_TOKEN }}"
